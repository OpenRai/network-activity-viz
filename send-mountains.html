<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Send mountains: live Nano sends as a density landscape</title>
<style>
:root{--ink:#080718;--fg:#e6ecff;--dim:#8f98c4;--line:#2b2760;--ember:#ff6a3c;--cyan:#2fc4d6;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--fg);overflow:hidden;
font:13px/1.45 "Bahnschrift","DIN Alternate","Avenir Next Condensed","Roboto Condensed","Arial Narrow",sans-serif}
#c,#o{position:absolute;inset:0 0 68px;width:100%;height:calc(100% - 68px)}
#c{image-rendering:pixelated}
#o{pointer-events:none}
#hud{position:absolute;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));
width:min(300px,calc(100% - 20px));padding:12px 14px;background:rgba(8,7,24,.8);border:1px solid var(--line);border-radius:4px;backdrop-filter:blur(6px)}
h1{font-size:20px;margin:0 0 4px;font-weight:700;letter-spacing:.01em}
#st{display:flex;gap:7px;align-items:center;color:var(--dim);margin-bottom:8px}
#dot{width:8px;height:8px;border-radius:50%;background:#666;flex:none}
#dot.on{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
#dot.sim{background:var(--ember);box-shadow:0 0 8px var(--ember)}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0}
select,button{background:#14123a;color:var(--fg);border:1px solid var(--line);border-radius:3px;padding:3px 8px;font:inherit}
input{accent-color:var(--cyan)}
select:focus-visible,button:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
#hud .controls{display:grid;gap:3px;margin:5px 0}
#hud .controls label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:3px 0}
#stats{margin:8px 0 6px;white-space:pre-line}
#lg{display:block;width:100%;height:8px;border-radius:2px}
.marker-key{display:flex;gap:16px;color:var(--dim);font-size:11px;margin-top:7px}
.marker-key i{display:inline-block;width:7px;height:7px;border:1px solid currentColor;border-radius:50%;margin-right:5px;vertical-align:1px}
.marker-key .send{color:#ffc078}.marker-key .receive{color:#69e9f1}
.n{color:var(--dim);font-size:12px;margin:5px 0 0}
</style>
</head>
<body>
<canvas id="c"></canvas><canvas id="o"></canvas>
<details id="hud">
<summary><h1>Send mountains</h1></summary>
<div id="st"><i id="dot"></i><span id="stt">starting</span></div>
<div class="controls"><label>Node <select id="feed"></select></label></div>
<label class="r">SoundFX <input id="snd" type="checkbox" checked aria-describedby="audioState"></label>
<label class="r">Sound set <select id="soundSet"><option value="choir" selected>Voices beyond the heliopause</option><option value="orbit">Rings of the uncanny</option></select></label>
<div id="audioState" class="n" role="status"></div>
<label class="r">Height scale <select id="hm"><option>sqrt</option><option>linear</option><option>log</option></select></label>
<div id="stats"></div>
<canvas id="lg" width="256" height="8"></canvas>
<div class="r n"><span>0</span><span id="mx"></span></div>
<div class="marker-key"><span class="send"><i></i>Send</span><span class="receive"><i></i>Receive</span></div>
</details>
<script src="js/hud-card.js"></script>
<script src="js/gallery-nav.js"></script>
<script src="js/page-settings.js"></script>
<script src="js/event-utils.js"></script>
<script src="js/nano-feed.js"></script>
<script src="js/sound-fx.js"></script>
<script src="js/stress-demo.js"></script>
<script src="js/send-mountains.js"></script>
</body>
</html>
